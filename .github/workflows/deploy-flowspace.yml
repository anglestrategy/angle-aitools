name: Deploy Flowspace to GitHub Pages

on:
  push:
    branches: [claude/project-mgmt-platform-clone-4ku5ko]
    paths:
      - "flowspace/**"
      - ".github/workflows/deploy-flowspace.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: flowspace/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: flowspace
      - name: Build static export
        run: npm run build
        working-directory: flowspace
        env:
          STATIC_EXPORT: "1"
          PAGES_BASE_PATH: /angle-aitools
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: flowspace/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
